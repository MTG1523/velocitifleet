# ─────────────────────────────────────────────
#  VelocitiFleet Backend — application.properties
# ─────────────────────────────────────────────

# ── Server ────────────────────────────────────
server.port=8080

# ── PostgreSQL DataSource ──────────────────────
# Update these values to match your local DB setup
spring.datasource.url=jdbc:postgresql://localhost:5432/velocitifleet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ───────────────────
spring.datasource.hikari.pool-name=VelocitiFleetPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ── Spring SQL Init (disabled — use schema.sql manually) ──
spring.sql.init.mode=never

# ── Jackson ───────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ── Logging ───────────────────────────────────
logging.level.com.velocitifleet=DEBUG
logging.level.com.zaxxer.hikari=INFO
